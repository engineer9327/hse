<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고속선 기상검지장치 기상현황</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── 비밀번호 화면 ── -->
<div id="pw-screen" style="
  position:fixed;inset:0;background:#1e2535;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;gap:20px;
">
  <div style="font-size:32px">🚄</div>
  <div style="font-size:18px;font-weight:700;color:#e8ecf4;letter-spacing:-0.3px">고속선 기상검지장치 기상현황</div>
  <div style="font-size:13px;color:#9aa3b8;margin-top:-8px">접근 비밀번호를 입력하세요</div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px">
    <input id="pw-input" type="password" placeholder="비밀번호"
      style="
        background:#2c3347;border:1px solid #3d4561;color:#e8ecf4;
        border-radius:8px;padding:12px 20px;font-size:18px;
        text-align:center;letter-spacing:6px;width:180px;outline:none;
      "
      onkeydown="if(event.key==='Enter')checkPw()"
    >
    <div id="pw-error" style="color:#d32f2f;font-size:12px;height:16px"></div>
    <button onclick="checkPw()" style="
      background:#1a6fc4;border:none;color:#fff;
      padding:10px 40px;border-radius:8px;font-size:14px;
      font-weight:600;cursor:pointer;width:180px;
    ">확인</button>
  </div>
</div>


<div class="modal-overlay" id="api-modal" style="display:none">
  <div class="modal">
    <h3>🔑 API 키 설정</h3>
    <label for="inp-kakao">카카오 JavaScript 앱 키</label>
    <input type="text" id="inp-kakao" placeholder="카카오 Developers JS 앱 키">
    <label for="inp-kma">기상청 API 키 (공공데이터포털)</label>
    <input type="text" id="inp-kma" placeholder="data.go.kr 서비스키">
    <button onclick="saveApiKeys()">저장하고 시작</button>
    <p class="note">※ 키는 브라우저 로컬에만 저장됩니다.</p>
  </div>
</div>

<header>
  <span style="font-size:20px">🚄</span>
  <h1>고속선 기상검지장치 기상현황</h1>
  <span class="sub">경부·호남·수도권 고속선</span>
  <div class="header-right">
    <span id="clock"></span>
    <button id="refresh-btn" onclick="refreshWeather()">⟳ 갱신</button>
    <button id="refresh-btn" onclick="showApiModal()" style="background:var(--gray3);margin-left:4px">⚙ 설정</button>
  </div>
</header>

<div class="main">
  <div id="map-container">
    <div id="map"></div>
    <div class="line-tabs">
      <div class="line-tab all active" onclick="filterLine('all',event)">전체</div>
      <div class="line-tab gyeongbu" onclick="filterLine('경부',event)">경부선</div>
      <div class="line-tab honam" onclick="filterLine('호남',event)">호남선</div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#e07b00"></div>기상검지장치 (경부선)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2a9d5c"></div>기상검지장치 (호남선)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#5ba3d9"></div>적설검지 AWS (❄)</div>
      <div class="legend-item"><div class="legend-dot" style="background:#d32f2f"></div>풍속 ≥14 m/s (주의)</div>
    </div>
  </div>
  <div id="panel">
    <div class="empty-panel">
      <div class="icon">🌤️</div>
      <p>지도에서 <strong>기상검지장치</strong> 또는<br>
         <strong>기상청 관측소(파란 점)</strong>를 클릭하면<br>
         현재 기상 및 예보를 표시합니다.</p>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="utils.js"></script>
<script src="kma.js"></script>

<script>
// ── 전역 ──
let kakaoMap, geocoder;
let meteoMarkers    = [];
let allKmaMarkers   = [];   // 기상청 관측소 606개 전체
let snowMarkers     = [];   // 적설검지 AWS 마커
let imgSnow, imgSnowSelected;
let selectedKmaMarker = null;
let linkedStations  = {};
let currentFilter   = 'all';
let siteCoords      = {};
let currentSiteData = null;
// MarkerImage 객체 (Kakao 로드 후 생성)
let imgDot, imgDotSelected;

// ── Kakao 지도 초기화 ──
function initKakaoMap() {
  kakaoMap = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(36.5, 127.8), level: 9
  });
  geocoder = new kakao.maps.services.Geocoder();
  kakaoMap.addControl(new kakao.maps.ZoomControl(),    kakao.maps.ControlPosition.RIGHT);
  kakaoMap.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPRIGHT);

  // 적설검지 AWS 마커 이미지
  const makeSnowSvg = (r, fill) =>
    'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="${r*2}" height="${r*2}">` +
      `<circle cx="${r}" cy="${r}" r="${r-1.5}" fill="${fill}" stroke="white" stroke-width="1.5"/>` +
      `<text x="${r}" y="${r+3.5}" font-size="${r*0.9}" text-anchor="middle" fill="white" font-family="sans-serif">❄</text></svg>`
    );
  imgSnow = new kakao.maps.MarkerImage(
    makeSnowSvg(9,'#5ba3d9'), new kakao.maps.Size(18,18),
    { offset: new kakao.maps.Point(9,9) }
  );
  imgSnowSelected = new kakao.maps.MarkerImage(
    makeSnowSvg(13,'#2196f3'), new kakao.maps.Size(26,26),
    { offset: new kakao.maps.Point(13,13) }
  );

  // 기상청 관측소 마커 이미지 생성
  const makeSvg = (r, fill, stroke, sw) =>
    'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="${r*2}" height="${r*2}">` +
      `<circle cx="${r}" cy="${r}" r="${r-sw/2}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/></svg>`
    );

  imgDot = new kakao.maps.MarkerImage(
    makeSvg(6,'#1a6fc4','white',1.5), new kakao.maps.Size(12,12),
    { offset: new kakao.maps.Point(6,6) }
  );
  imgDotSelected = new kakao.maps.MarkerImage(
    makeSvg(12,'#4a9fe8','white',2.5), new kakao.maps.Size(24,24),
    { offset: new kakao.maps.Point(12,12) }
  );

  // KMA 관측소 전체 표시
  placeAllKmaMarkers();

  // 적설검지 AWS 지점 사전 파악 + 마커 배치
  fetchSnowStations().then(async snowIds => {
    const stnCoords = await fetchAwsStationCoords();
    placeSnowMarkers(snowIds, stnCoords);
  });

  // 기상검지장치 지오코딩 → 마커
  geocodeAllSites().then(() => {
    computeLinkedStations();
    placeMeteoMarkers();
  });
}

// ── KMA 전체 관측소 마커 (606개) ──
function placeAllKmaMarkers() {
  allKmaMarkers.forEach(m => m.setMap(null));
  allKmaMarkers = [];
  KMA_STATIONS.forEach(st => {
    const m = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(st.lat, st.lon),
      image: imgDot,
      title: `${st.name} (지점 ${st.id})`
    });
    m.setMap(kakaoMap);
    m._st = st;
    kakao.maps.event.addListener(m, 'click', () => onKmaClick(m));
    allKmaMarkers.push(m);
  });
}


// ── 적설검지 AWS 마커 배치 ──
function placeSnowMarkers(snowIds, stnCoords) {
  snowMarkers.forEach(m => m.setMap(null));
  snowMarkers = [];
  if (!snowIds?.size || !stnCoords) return;

  snowIds.forEach(id => {
    const c = stnCoords[id];
    if (!c) return;
    const m = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(c.lat, c.lon),
      image: imgSnow,
      title: `❄ ${c.name} (지점 ${id}) - 적설검지`
    });
    m.setMap(kakaoMap);
    m._st = { ...c, id };
    m._isSnow = true;
    kakao.maps.event.addListener(m, 'click', () => onKmaClick(m));
    snowMarkers.push(m);
  });
  console.log(`[MAP] 적설검지 마커: ${snowMarkers.length}개`);
}

function onKmaClick(marker) {
  // 이전 선택 해제
  if (selectedKmaMarker && selectedKmaMarker !== marker) {
    selectedKmaMarker.setImage(imgDot);
  }
  marker.setImage(imgDotSelected);
  selectedKmaMarker = marker;
  currentSiteData = null;
  const st = marker._st;
  showKmaPanel(st);
}

async function showKmaPanel(st) {
  document.getElementById('panel').innerHTML = `
    <div class="panel-header">
      <h2>🔵 ${st.name}</h2>
      <div class="site-id">지점 ${st.id} | ${st.addr || ''}</div>
    </div>
    <div class="loading"><div class="spinner"></div>AWS 데이터 조회 중...</div>`;
  const allAws = await fetchAllAws();
  const aws = allAws ? allAws[String(st.id)] : null;
  renderKmaPanel(st, aws);
  startAutoRefresh();
}

function renderKmaPanel(st, aws) {
  const wClass = windClass(aws?.WS);
  const obsTime = aws?.TM ? formatObsTime(aws.TM) : '–';
  let awsHtml = '';
  if (aws) {
    awsHtml = `
      <div class="section-title">현재 기상 <span style="font-weight:400">(AWS 실측 · ${obsTime})</span></div>
      <div class="current-weather">
        <div class="wx-card ${wClass}">
          <div class="label">풍속${aws.WS===null?' <span style=\'color:#f9a825;font-weight:400\'>결측</span>':''}</div>
          <div class="value">${aws.WS!==null?fmt(aws.WS)+'<span class=\'unit\'> m/s</span>':'–'}</div>
          <div class="sub">풍향: ${aws.WD!==null?vecToDir(parseFloat(aws.WD))+' ('+fmt(aws.WD,'°')+')':'결측'}</div>
        </div>
        <div class="wx-card">
          <div class="label">기온</div>
          <div class="value">${fmt(aws.TA)}<span class="unit">°C</span></div>
          <div class="sub">이슬점: ${fmt(aws.TD,'°C')}</div>
        </div>
        <div class="wx-card">
          <div class="label">강수량${aws.RN===null?' <span style=\'color:#f9a825;font-weight:400\'>결측</span>':''}</div>
          <div class="value">${aws.RN!==null?fmt(aws.RN)+'<span class=\'unit\'> mm</span>':'–'}</div>
          <div class="sub">일강수: ${aws.RN_DAY!==null?fmt(aws.RN_DAY,' mm'):'결측'}</div>
        </div>
        <div class="wx-card">
          <div class="label">습도</div>
          <div class="value">${fmt(aws.HM)}<span class="unit"> %</span></div>
          <div class="sub">기압: ${fmt(aws.PA,' hPa')}</div>
        </div>
        <div class="wx-card">
          <div class="label">신적설 (3h)</div>
          <div class="value">${aws.SD_HR3!==null?fmt(aws.SD_HR3)+'<span class=\'unit\'> cm</span>':'–'}</div>
          <div class="sub">일최심: ${aws.SD_DAY!==null?fmt(aws.SD_DAY,' cm'):'–'}</div>
        </div>
        <div class="wx-card">
          <div class="label">최대순간풍속</div>
          <div class="value">${aws.GST_WS!==null?fmt(aws.GST_WS)+'<span class=\'unit\'> m/s</span>':'–'}</div>
          <div class="sub">총적설: ${aws.SD_TOT!==null?fmt(aws.SD_TOT,' cm'):'–'}</div>
        </div>
      </div>`;
  } else {
    awsHtml = `<div class="section-title">현재 기상</div>
      <div class="station-info" style="color:#f9a825;padding:8px 16px 12px">
        ⚠️ AWS 데이터 없음
      </div>`;
  }
  document.getElementById('panel').innerHTML = `
    <div class="panel-header">
      <h2>🔵 ${st.name}</h2>
      <div class="site-id">지점 ${st.id} | ${st.addr}</div>
    </div>
    ${awsHtml}
    ${site.sensors.includes('강설') && snowResult ? `
    <div class="section-title" style="color:#5ba3d9">❄ 적설검지 AWS <span style="font-weight:400">(${snowResult.station.name} · ${snowResult.distKm.toFixed(1)}km)</span></div>
    <div class="current-weather">
      <div class="wx-card">
        <div class="label">3시간 신적설</div>
        <div class="value">${snowAws?.SD_HR3 !== null && snowAws?.SD_HR3 ? snowAws.SD_HR3+'<span class="unit"> cm</span>' : '<span style="color:var(--text-dim);font-size:13px">적설 없음</span>'}</div>
        <div class="sub">일최심신적설: ${snowAws?.SD_DAY ?? '–'} cm</div>
      </div>
      <div class="wx-card">
        <div class="label">총 적설</div>
        <div class="value">${snowAws?.SD_TOT !== null && snowAws?.SD_TOT ? snowAws.SD_TOT+'<span class="unit"> cm</span>' : '<span style="color:var(--text-dim);font-size:13px">적설 없음</span>'}</div>
        <div class="sub">관측: ${formatObsTime(snowAws?.TM)}</div>
      </div>
    </div>` : ''}
    <div style="padding:8px 16px;font-size:11px;color:var(--text-dim)">⟳ 1분마다 자동 갱신</div>`;
}

// ── 지오코딩 (fallback 포함) ──
async function geocodeAllSites() {
  // 구 캐시 삭제 후 v3 사용
  localStorage.removeItem('meteo_coords_v4');
  const cached = localStorage.getItem('meteo_coords_v5');
  if (cached) {
    siteCoords = JSON.parse(cached);
    if (METEO_SITES.every(s => siteCoords[s.id])) { console.log('좌표 캐시(v3) 로드'); return; }
  }
  METEO_SITES.forEach(s => { siteCoords[s.id] = { lat: s.lat, lng: s.lng, fallback: true }; });
  const promises = METEO_SITES.map(site => new Promise(resolve => {
    geocoder.addressSearch(site.addr, (result, status) => {
      if (status === kakao.maps.services.Status.OK) {
        siteCoords[site.id] = { lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) };
      } else {
        console.warn(`기본좌표 사용: ${site.room}`);
      }
      resolve();
    });
  }));
  await Promise.all(promises);
  localStorage.setItem('meteo_coords_v5', JSON.stringify(siteCoords));
}

// ── 최근접 관측소 사전 계산 ──
function computeLinkedStations() {
  linkedStations = {};
  METEO_SITES.forEach(s => {
    const c = siteCoords[s.id];
    if (c) linkedStations[s.id] = findNearestStation(c.lat, c.lng).station;
  });
}

// ── 기상검지장치 마커 ──
function placeMeteoMarkers() {
  meteoMarkers.forEach(m => m.setMap(null));
  meteoMarkers = [];
  METEO_SITES.forEach(site => {
    const c = siteCoords[site.id];
    if (!c) return;
    if (currentFilter !== 'all' && site.line !== currentFilter) return;
    const color = site.line === '경부' ? '#e07b00' : '#2a9d5c';
    const el = document.createElement('div');
    el.innerHTML = `<div style="
      width:36px;height:36px;border-radius:50%;
      background:${color};border:2.5px solid #fff;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.45);
      font-size:16px;transition:transform .15s;
    " title="${site.room}\n${site.id}"
       onmouseover="this.style.transform='scale(1.2)'"
       onmouseout="this.style.transform='scale(1)'">
      <svg width="20" height="14" viewBox="0 0 20 14" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 3.5C5 1.5 11 1.5 15 4C17 5.5 16.5 8.5 14 8.5" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        <path d="M1 9C4.5 7 9.5 6.5 13 9C14.5 10 14 13 11.5 13" stroke="white" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      </svg>
    </div>`;
    el.firstElementChild.addEventListener('click', () => onMeteoClick(site, c));
    const ov = new kakao.maps.CustomOverlay({
      position: new kakao.maps.LatLng(c.lat, c.lng),
      content: el, yAnchor: 0.5, zIndex: 3
    });
    ov.setMap(kakaoMap);
    meteoMarkers.push(ov);
  });
}

// ── 기상검지장치 클릭 ──
async function onMeteoClick(site, coords) {
  currentSiteData = { site, coords };
  if (selectedKmaMarker) { selectedKmaMarker.setImage(imgDot); selectedKmaMarker = null; }
  snowMarkers.forEach(m => m.setImage(imgSnow));
  showPanelLoading(site);
  kakaoMap.panTo(new kakao.maps.LatLng(coords.lat, coords.lng));

  const hasSnow    = site.sensors.includes('강설');
  const onlySnow   = hasSnow && site.sensors.length === 1;

  // ── 일반 기상 AWS (강설 전용 개소는 조회 생략) ──
  let aws = null, station = null, distKm = 0;
  if (!onlySnow) {
    const allAws = await fetchAllAws();
    const result  = await findNearestAws(coords.lat, coords.lng, allAws);
    station  = result?.station;
    distKm   = result?.distKm || 0;
    aws      = (allAws && station) ? allAws[String(station.id)] : null;
    if (station) {
      const m = allKmaMarkers.find(mk => mk._st.id === station.id);
      if (m) { m.setImage(imgDotSelected); selectedKmaMarker = m; }
    }
  }

  // ── 적설검지 AWS (강설 센서 있는 경우만) ──
  let snowResult = null, snowAws = null;
  if (hasSnow) {
    snowResult = await findNearestSnowAws(coords.lat, coords.lng);
    if (snowResult) {
      snowAws = await fetchCurrentSnowData(snowResult.station.id);
      const sm = snowMarkers.find(mk => String(mk._st.id) === String(snowResult.station.id));
      if (sm) sm.setImage(imgSnowSelected);
    }
  }

  renderMeteoPanel(site, station, distKm, aws, snowResult, snowAws);
  startAutoRefresh();
}

function showPanelLoading(site) {
  const c = site.line === '경부' ? '#e07b00' : '#2a9d5c';
  document.getElementById('panel').innerHTML = `
    <div class="panel-header">
      <h2><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:6px;vertical-align:middle"></span>${site.room}</h2>
      <div class="site-id">${site.id} | ${site.line}선 ${site.track} | ${site.sensors.join(', ')}</div>
    </div>
    <div class="loading"><div class="spinner"></div>기상 데이터 조회 중...</div>`;
}

function renderMeteoPanel(site, station, distKm, aws, snowResult=null, snowAws=null) {
  const lc      = site.line === '경부' ? '#e07b00' : '#2a9d5c';
  const hasSnow = site.sensors.includes('강설');
  const onlySnow= hasSnow && site.sensors.length === 1;
  const wClass  = windClass(aws?.WS);
  const obsTime = aws?.TM ? formatObsTime(aws.TM) : '–';

  // ── 관측소 정보 섹션 ──
  const infoHtml = !onlySnow && station ? `
    <div class="section-title">관측소 정보</div>
    <div class="station-info">
      <strong>${station.name}</strong> (지점 ${station.id})<br>
      직선거리: <strong>${distKm.toFixed(1)} km</strong><br>
      관측소 주소: ${station.addr || '–'}<br>
      기상검지장치: ${site.addr}
    </div>` : '';

  // ── 일반 기상 섹션 (강설 전용 개소 제외) ──
  let awsHtml = '';
  if (!onlySnow) {
    awsHtml = aws ? `
      <div class="section-title">현재 기상 <span style="font-weight:400">(${station?.name ?? ''} AWS · ${obsTime})</span></div>
      <div class="current-weather">
        <div class="wx-card ${wClass}">
          <div class="label">풍속${aws.WS===null?' <span style="color:#f9a825;font-weight:400">결측</span>':''}</div>
          <div class="value">${aws.WS!==null?fmt(aws.WS)+'<span class="unit"> m/s</span>':'–'}</div>
          <div class="sub">풍향: ${aws.WD!==null?vecToDir(parseFloat(aws.WD))+' ('+fmt(aws.WD,'°')+')':'결측'}</div>
        </div>
        <div class="wx-card">
          <div class="label">기온</div>
          <div class="value">${fmt(aws.TA)}<span class="unit">°C</span></div>
          <div class="sub">이슬점: ${fmt(aws.TD,'°C')}</div>
        </div>
        <div class="wx-card">
          <div class="label">강수량${aws.RN===null?' <span style="color:#f9a825;font-weight:400">결측</span>':''}</div>
          <div class="value">${aws.RN!==null?fmt(aws.RN)+'<span class="unit"> mm</span>':'–'}</div>
          <div class="sub">일강수: ${aws.RN_DAY!==null?fmt(aws.RN_DAY,' mm'):'결측'}</div>
        </div>
        <div class="wx-card">
          <div class="label">습도</div>
          <div class="value">${fmt(aws.HM)}<span class="unit"> %</span></div>
          <div class="sub">기압: ${fmt(aws.PA,' hPa')}</div>
        </div>
        <div class="wx-card">
          <div class="label">신적설 (3h)</div>
          <div class="value">${aws.SD_HR3!==null?fmt(aws.SD_HR3)+'<span class="unit"> cm</span>':'–'}</div>
          <div class="sub">일최심: ${aws.SD_DAY!==null?fmt(aws.SD_DAY,' cm'):'–'}</div>
        </div>
        <div class="wx-card">
          <div class="label">최대순간풍속</div>
          <div class="value">${aws.GST_WS!==null?fmt(aws.GST_WS)+'<span class="unit"> m/s</span>':'–'}</div>
          <div class="sub">총적설: ${aws.SD_TOT!==null?fmt(aws.SD_TOT,' cm'):'–'}</div>
        </div>
      </div>` : `
      <div class="section-title">현재 기상</div>
      <div class="station-info" style="color:#f9a825;padding:8px 16px 12px">
        ⚠️ AWS 데이터 없음<br>
        <span style="font-size:11px;color:var(--text-dim)">브라우저 콘솔(F12)에서 [AWS] 로그를 확인하세요.</span>
      </div>`;
  }

  // ── 적설검지 섹션 (강설 센서 있는 경우) ──
  let snowHtml = '';
  if (hasSnow) {
    const sdTime = formatObsTime(snowAws?.TM);
    const stnName  = snowResult?.station?.name || '–';
    const stnId    = snowResult?.station?.id   || '–';
    const stnDist  = snowResult ? snowResult.distKm.toFixed(1) : '–';
    const fallback = snowResult?.type !== 'snow';  // 전용 적설검지가 아닌 경우
    const noSnow   = !snowAws?.SD_HR3 && !snowAws?.SD_TOT;  // 현재 적설 없음 (여름철)

    snowHtml = `
      <div class="section-title" style="color:#5ba3d9">
        ❄ 인근 적설 AWS
        ${snowResult ? '<span style="font-weight:400">('+stnName+' · '+stnDist+'km)</span>' : ''}
      </div>
      ${!snowResult ? '<div class="station-info" style="color:#f9a825;padding:8px 16px 12px">⚠️ 인근 AWS 지점 없음</div>' : `
      <div class="current-weather">
        <div class="wx-card" style="border-color:#5ba3d9">
          <div class="label">3시간 신적설</div>
          <div class="value" style="font-size:18px">
            ${snowAws?.SD_HR3 ? fmt(snowAws.SD_HR3)+'<span class="unit"> cm</span>'
              : '<span style="color:var(--text-dim);font-size:13px">없음</span>'}
          </div>
          <div class="sub">일최심신적설: ${snowAws?.SD_DAY ? fmt(snowAws.SD_DAY)+' cm' : '–'}</div>
        </div>
        <div class="wx-card" style="border-color:#5ba3d9">
          <div class="label">총 적설</div>
          <div class="value" style="font-size:18px">
            ${snowAws?.SD_TOT ? fmt(snowAws.SD_TOT)+'<span class="unit"> cm</span>'
              : '<span style="color:var(--text-dim);font-size:13px">없음</span>'}
          </div>
          <div class="sub">관측: ${sdTime} | 지점 ${stnId}${noSnow ? ' · 현재 적설 없음' : ''}</div>
        </div>
      </div>
      ${noSnow ? '<div style="padding:2px 16px 10px;font-size:11px;color:var(--text-dim)">※ 여름철 적설 없음 — 강설 시 자동 표시</div>' : ''}`}`;
  }

  document.getElementById('panel').innerHTML = `
    <div class="panel-header">
      <h2><span style="display:inline-block;width:10px;height:10px;border-radius:50%;
        background:${lc};margin-right:6px;vertical-align:middle"></span>${site.room}</h2>
      <div class="site-id">${site.id} | ${site.line}선 ${site.track} | 센서: ${site.sensors.join(', ')}</div>
    </div>
    ${infoHtml}
    ${awsHtml}
    ${snowHtml}
    <div style="padding:8px 16px;font-size:11px;color:var(--text-dim)">⟳ 1분마다 자동 갱신</div>`;
}

// ── 노선 필터 ──
function filterLine(line, e) {
  currentFilter = line;
  document.querySelectorAll('.line-tab').forEach(t => t.classList.remove('active'));
  if (e?.target) e.target.classList.add('active');
  if (selectedKmaMarker) { selectedKmaMarker.setImage(imgDot); selectedKmaMarker = null; }
  currentSiteData = null;
  placeMeteoMarkers();
  document.getElementById('panel').innerHTML = `
    <div class="empty-panel"><div class="icon">🌤️</div>
    <p>지도에서 <strong>기상검지장치</strong> 또는<br>
       <strong>기상청 관측소(파란 점)</strong>를 클릭하면<br>
       현재 기상 및 예보를 표시합니다.</p></div>`;
}

// ── 자동 갱신 ──
let _autoTimer = null;
function startAutoRefresh() {
  stopAutoRefresh();
  _autoTimer = setInterval(refreshWeather, 60000);
}
function stopAutoRefresh() {
  if (_autoTimer) { clearInterval(_autoTimer); _autoTimer = null; }
}
function refreshWeather() {
  if (selectedKmaMarker) { showKmaPanel(selectedKmaMarker._st); return; }
  if (currentSiteData) { onMeteoClick(currentSiteData.site, currentSiteData.coords); }
}

// ── 시계 ──
// 창 크기 변경 시 지도 재조정 (모바일↔데스크톱 전환 대응)
window.addEventListener('resize', () => {
  if (kakaoMap) { kakaoMap.relayout(); }
});

setInterval(() => {
  document.getElementById('clock').textContent =
    new Date().toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}, 1000);

// ── API 키 ──
function saveApiKeys() {
  const k=document.getElementById('inp-kakao').value.trim();
  const m=document.getElementById('inp-kma').value.trim();
  if (!k||!m){alert('두 키를 모두 입력해 주세요.');return;}
  localStorage.setItem('kakao_app_key',k);
  localStorage.setItem('kma_api_key',m);
  location.reload();
}
function showApiModal(){ document.getElementById('api-modal').style.display='flex'; }

// ── 부트스트랩 ──
function bootstrap() {
  // file:// 프로토콜 경고
  if (location.protocol === 'file:') {
    document.getElementById('map-container').innerHTML = `
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
        height:100%;color:#e8ecf4;text-align:center;gap:14px;padding:32px;background:#1e2535;">
        <div style="font-size:48px">⚠️</div>
        <div style="font-size:15px;font-weight:700;color:#f9a825">파일 직접 열기 불가</div>
        <div style="font-size:13px;color:#9aa3b8;line-height:1.9;max-width:380px">
          <b style="color:#e8ecf4">index.html을 직접 열면 CORS 오류가 발생합니다.</b><br>
          아래 방법 중 하나로 실행하세요:<br><br>
          VS Code → index.html 우클릭<br>→ <b style="color:#4a9fe8">Open with Live Server</b><br><br>
          또는 접속:<br>
          <code style="background:#2c3347;padding:3px 8px;border-radius:4px">https://engineer9327.github.io/hse</code>
        </div>
      </div>`;
    return;
  }
  let kk=CONFIG.KAKAO_APP_KEY, km=CONFIG.KMA_API_KEY;
  if(kk==='YOUR_KAKAO_APP_KEY') kk=localStorage.getItem('kakao_app_key')||'';
  if(km==='YOUR_KMA_API_KEY'){km=localStorage.getItem('kma_api_key')||'';CONFIG.KMA_API_KEY=km;}
  if(!kk||!km){document.getElementById('api-modal').style.display='flex';return;}
  CONFIG.KMA_API_KEY=km;
  const s=document.createElement('script');
  s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kk}&libraries=services&autoload=false`;
  s.onload=()=>{kakao.maps.load(initKakaoMap);};
  s.onerror=()=>{
    document.getElementById('map-container').innerHTML=`
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;
        height:100%;color:#e8ecf4;text-align:center;gap:16px;padding:32px;background:#1e2535;">
        <div style="font-size:48px">⚠️</div>
        <div style="font-size:16px;font-weight:700;color:#f9a825">카카오 지도 로드 실패</div>
        <div style="font-size:13px;color:#9aa3b8;line-height:1.9;max-width:420px">
          카카오 Developers → 앱 키 → <b style="color:#4a9fe8">JavaScript 키</b> 확인<br>
          플랫폼 → Web → <code style="background:#2c3347;padding:2px 6px;border-radius:3px">${location.origin}</code> 등록 확인
        </div>
        <button onclick="showApiModal()" style="background:#1a6fc4;border:none;color:#fff;padding:10px 22px;border-radius:6px;font-size:13px;cursor:pointer">⚙ API 키 다시 입력</button>
      </div>`;
  };
  document.head.appendChild(s);
}
window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('auth') === 'ok') {
    document.getElementById('pw-screen').style.display = 'none';
    bootstrap();
  } else {
    document.getElementById('pw-input').focus();
  }
});

// ── 비밀번호 확인 ──
function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === '8540') {
    sessionStorage.setItem('auth', 'ok');
    document.getElementById('pw-screen').style.display = 'none';
    bootstrap();
  } else {
    document.getElementById('pw-error').textContent = '비밀번호가 틀렸습니다.';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}
